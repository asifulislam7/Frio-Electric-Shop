<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Shop - Delivery Staff</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h2>⚡ Electric Shop - Delivery Staff Panel</h2>
        <p>Staff Name: Rahim Uddin (ID: #DS-104) | <button onclick="logout()" class="logout-btn">Logout</button></p>
    </div>

    <div class="summary-box">
        <div class="card">Total Orders: <span id="total-count">0</span></div>
        <div class="card">Pending: <span id="pending-count">0</span></div>
        <div class="card">Out for Delivery: <span id="transit-count">0</span></div>
        <div class="card">Delivered: <span id="delivered-count">0</span></div>
    </div>

    <div class="filter-section">
        <input type="text" id="search-location" placeholder="Search by location..." onkeyup="displayOrders()">
        <select id="filter-status" onchange="displayOrders()">
            <option value="All">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered">Delivered</option>
        </select>
    </div>

    <h3>Assigned Delivery Orders</h3>
    <table>
        <thead>
            <tr>
                <th>Delivery ID</th>
                <th>Order ID</th>
                <th>Customer Name</th>
                <th>Address</th>
                <th>Date</th>
                <th>Status</th>
                <th>Update Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="order-table-body">
        </tbody>
    </table>

    <div id="details-box" class="details-modal">
        <div class="modal-content">
            <h3>Order Details</h3>
            <div id="modal-text"></div>
            <button onclick="closeDetails()" class="close-btn">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
